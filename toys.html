<title>All toys | Patopato</title>

<body>
<header class="top" id="top"></header>
<main>
<div class="wrap">
<section class="cat-head"><h1 id="cat-title"></h1><p class="muted" id="cat-desc"></p></section>
<section class="page-head"><h1 id="toys-title">All toys</h1><p class="muted" style="max-width:62ch">Every Patopato toy in one list: <b>free</b> toys on MakerWorld and <b>members-only</b> toys on Patreon. Each card links to where you can get it.</p>
<div class="hero-btns" style="justify-content:flex-start"><a class="chip" href="#all" id="show-all">All</a><a class="chip" href="#all" id="show-free">Free</a><a class="chip" href="#all" id="show-members">Members only</a></div></section>
<section class="section" style="padding-top:12px">
  <div class="tools">
    <nav class="chips" id="filters" aria-label="Filter"></nav>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <input class="search" id="q" type="search" placeholder="Search toys" aria-label="Search toys">
      <label class="count">Show <select id="platform"></select></label>
      <label class="count">Sort <select id="sort"><option value="pop">Most downloaded</option><option value="new">Newest</option></select></label>
      <span class="count" id="found"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>
</div>
</main>
<footer class="foot" id="foot"></footer>
